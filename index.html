<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./form-style.css">
    <link rel="stylesheet" href="./footer.css">
</head>

<body>
    <main class="page">
        <section class="card" aria-label="Student details">
            <header class="card__header">
                <h1 class="card__title">Car Insurance Form</h1>
            </header>

            <form id="car-insurance-form" class="form">
                <!-- Name -->
                <div class="field-group">
                    <label class="field__label full-width">Name</label>
                    <div class="row">
                        <input class="field__input" type="text" id="firstName" name="firstName" placeholder="First"
                            required>
                        <input class="field__input" type="text" id="lastName" name="lastName" placeholder="Last"
                            required>
                    </div>
                </div>

                <!-- Email & Phone -->
                <div class="field-group">
                    <div class="row">
                        <div class="col">
                            <label class="field__label full-width" for="email">Email</label>
                            <input class="field__input full-width" type="email" id="email" name="email">
                        </div>
                        <div class="col">
                            <label class="field__label full-width" for="phone">Phone</label>
                            <input class="field__input full-width" type="tel" id="phone" name="phone"
                                placeholder="### ### ####">
                        </div>
                    </div>
                </div>

                <!-- Primary Driver -->
                <div class="field-group">
                    <label class="field__label full-width">Who will be the primary driver of this vehicle?</label>
                    <div class="row">
                        <input class="field__input" type="text" id="driverFirstName" name="driverFirstName"
                            placeholder="First">
                        <input class="field__input" type="text" id="driverLastName" name="driverLastName"
                            placeholder="Last">
                    </div>
                </div>

                <!-- Commute -->
                <div class="field-group">
                    <label class="field__label full-width">How far is the primary driver's commute one way?</label>
                    <div class="radio-options vertical">
                        <label class="radio-btn"><input type="radio" name="commute" value="Pleasure use only">
                            <span>Pleasure use only</span></label>
                        <label class="radio-btn"><input type="radio" name="commute" value="Less than 3 miles">
                            <span>Less than 3 miles</span></label>
                        <label class="radio-btn"><input type="radio" name="commute" value="Less than 10 miles">
                            <span>Less than 10 miles</span></label>
                        <label class="radio-btn"><input type="radio" name="commute" value="More than 10 miles">
                            <span>More than 10 miles</span></label>
                    </div>
                </div>

                <!-- Parking -->
                <div class="field-group">
                    <label class="field__label full-width">Where do you park your car?</label>
                    <div class="radio-options vertical">
                        <label class="radio-btn"><input type="radio" name="parking" value="A private garage"> <span>A
                                private garage</span></label>
                        <label class="radio-btn"><input type="radio" name="parking" value="The driveway"> <span>The
                                driveway</span></label>
                        <label class="radio-btn"><input type="radio" name="parking" value="A quiet residential street">
                            <span>A quiet residential street</span></label>
                        <label class="radio-btn"><input type="radio" name="parking" value="other">
                            <span>other:</span></label>
                    </div>
                </div>

                <!-- Coverage -->
                <div class="field-group">
                    <label class="field__label full-width">Do you want Comprehensive and Collision coverage for this
                        vehicle?</label>
                    <div class="radio-options vertical">
                        <label class="radio-btn"><input type="radio" name="coverage" value="Yes">
                            <span>Yes</span></label>
                        <label class="radio-btn"><input type="radio" name="coverage" value="No"> <span>No</span></label>
                    </div>
                </div>

                <!-- Ownership -->
                <div class="field-group">
                    <label class="field__label full-width">Is this vehicle owned, leased, or financed?</label>
                    <div class="radio-options vertical">
                        <label class="radio-btn"><input type="radio" name="ownership" value="Owned">
                            <span>Owned</span></label>
                        <label class="radio-btn"><input type="radio" name="ownership" value="Leased">
                            <span>Leased</span></label>
                        <label class="radio-btn"><input type="radio" name="ownership" value="Financed">
                            <span>Financed</span></label>
                    </div>
                </div>

                <!-- State -->
                <div class="field-group">
                    <label class="field__label full-width">In what state is your vehicle registered?</label>
                    <input class="field__input full-width" type="text" id="state" name="state">
                </div>

                <div class="actions" style="justify-content: center;">
                    <button class="btn btn--primary" type="submit"
                        style="width: 150px; border-radius: 20px;">SEND</button>
                </div>
            </form>
        </section>

        <section class="chatbot-card" aria-label="Chatbot">
            <header class="chatbot-card__header">
                <h2 class="chatbot-card__title">AI Chatbot</h2>
                <p class="chatbot-card__subtitle">Upload File or enter text to chat</p>
                <select id="model-select"
                    style="margin-top: 10px; padding: 5px; border-radius: 5px; border: 1px solid #ccc; width: 100%;">
                    <option value="gemini">Gemini 2.5 Flash</option>
                    <option value="deepseek">DeepSeek R1</option>
                    <option value="groq">Groq (Llama3)</option>
                </select>
            </header>

            <div class="chatbot-content">
                <div class="input-options">
                    <button class="option-btn active" data-type="text" id="text-option">
                        <span>📝 Text</span>
                    </button>
                    <button class="option-btn" data-type="file" id="file-option">
                        <span>📂 Upload File</span>
                    </button>
                </div>

                <div class="chatbot-input-container" id="text-input-container">
                    <textarea class="chatbot-input" id="text-input" placeholder="Type your message here..."
                        rows="4"></textarea>
                </div>

                <div class="chatbot-input-container hidden" id="file-input-container">
                    <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.json,.txt" class="file-input">
                    <label for="file-input" class="file-label">
                        <span>📂 Choose File (CSV, Excel, JSON, TXT)</span>
                    </label>
                    <div class="file-name" id="file-name"></div>
                </div>

                <div class="chatbot-messages" id="chatbot-messages"></div>

                <div class="chatbot-actions">
                    <button class="btn btn--primary" id="send-btn">Send</button>
                    <button class="btn btn--ghost" id="clear-btn">Clear</button>
                </div>
            </div>
        </section>
    </main>
    <footer class="app-footer">
        <p>Made by <span class="heart-text">Arya Sumant</span> with <span class="love">♥</span></p>
    </footer>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
        window.GoogleGenerativeAI = GoogleGenerativeAI;
    </script>
    <script type="module" src="./chatbot.js"></script>
</body>

</html>
